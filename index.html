<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام الكاشير الذكي - النسخة المهيبة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
 body { font-family: 'Tajawal', Tahoma; background: #f1f5f9; margin: 0; padding: 0; }
 h1 { background: linear-gradient(135deg,#0f172a,#1e3a8a); color:white; margin:0; padding:20px; text-align:center; font-size:26px; }
 .container { display: flex; gap: 15px; flex-wrap: wrap; padding:15px; max-width:1100px; margin:auto; }
 .products,.cart { background: white; padding: 18px; border-radius: 18px; flex: 1; min-width: 320px; box-shadow: 0 4px 15px rgba(0,0,0,.06); border:1px solid #e2e8f0; }
 h2 { color: #0f172a; border-bottom: 2px solid #2563eb; padding-bottom: 8px; margin-top:0 }
 input, button { padding: 12px; margin: 6px 0; width: 100%; border-radius: 10px; border: 2px solid #e2e8f0; font-family:'Tajawal'; font-size:16px; box-sizing:border-box; }
 input:focus{border-color:#2563eb; outline:none}
 button { background: #2563eb; color: white; cursor: pointer; border: none; font-weight:700; transition:.2s }
 button:hover { background: #1d4ed8; transform:translateY(-1px); }
 .product-item { display: flex; justify-content: space-between; align-items:center; padding: 12px; border:1px solid #f1f5f9; border-radius:12px; margin:8px 0; background:#fff; transition:.2s }
 .product-item:hover { background: #f8fafc; border-color:#2563eb; }
 .product-actions button { width:auto; padding:6px 10px; margin:0 2px; font-size:14px; border-radius:8px; }
 .btn-edit{background:#eff6ff;color:#2563eb} .btn-edit:hover{background:#2563eb;color:white}
 .btn-del{background:#fef2f2;color:#ef4444}
 .alert { background: linear-gradient(135deg,#f59e0b,#f97316); color: white; padding: 12px; border-radius: 12px; margin: 8px 0; font-weight:600 }
 table { width: 100%; border-collapse: collapse; }
 td, th { padding: 10px; border-bottom: 1px solid #f1f5f9; text-align: center; }
 .total { font-size: 22px; font-weight: 800; color: #10b981; text-align:center; margin:15px 0; }
 .hidden{display:none !important}
 .search-wrap{position:sticky; top:0; background:white; z-index:5; padding-bottom:10px; border-radius:12px}
</style>
</head>
<body>
<h1>🧾 نظام الكاشير الذكي - النسخة المهيبة</h1>
<div class="container">
 <div class="products">
 <h2>المنتجات</h2>
 <div class="search-wrap">
   <input type="text" id="search" placeholder="🔍 ابحث عن منتج بالاسم...">
   <div style="display:flex;gap:8px">
     <button onclick="showAddForm()" style="flex:1">+ إضافة منتج جديد</button>
     <button onclick="toggleAll()" id="toggleBtn" style="flex:1;background:#0f172a">👁️ عرض كل الأصناف</button>
   </div>
 </div>

 <div id="addForm" style="display:none; background:#f8fafc; padding:12px; border-radius:12px; margin-top:10px; border:1px dashed #cbd5e1">
 <b id="formTitle">إضافة منتج</b>
 <input id="pName" placeholder="اسم المنتج">
 <input id="pPrice" type="number" placeholder="السعر">
 <input id="pQty" type="number" placeholder="الكمية">
 <input id="pBarcode" placeholder="الباركود (اختياري)">
 <button onclick="addProduct()" id="saveBtn">حفظ المنتج</button>
 <button onclick="closeForm()" style="background:#94a3b8">إلغاء</button>
 </div>

 <div id="productList" class="hidden"></div>
 <div id="alerts"></div>
 </div>

 <div class="cart">
 <h2>الفاتورة الحالية</h2>
 <table id="cartTable"><tr><th>المنتج</th><th>الكمية</th><th>السعر</th><th>حذف</th></tr></table>
 <p class="total">الإجمالي: <span id="total">0</span> جنيه</p>
 <button onclick="saveInvoice()">💾 حفظ الفاتورة</button>
 <button onclick="exportExcel()" style="background:#10b981">📊 تصدير Excel</button>
 <h3>الفواتير السابقة</h3>
 <div id="invoicesList"></div>
 </div>
</div>

<script>
let products = JSON.parse(localStorage.getItem('products')) || [];
let cart = [];
let invoices = JSON.parse(localStorage.getItem('invoices')) || [];
let editingId = null;
let showAll = false;

function showAddForm() {
 document.getElementById('addForm').style.display='block';
 if(editingId===null){ document.getElementById('formTitle').innerText='إضافة منتج جديد'; document.getElementById('saveBtn').innerText='حفظ المنتج'; }
 window.scrollTo({top:0,behavior:'smooth'});
}
function closeForm(){
 document.getElementById('addForm').style.display='none';
 editingId=null;
 document.getElementById('pName').value=''; document.getElementById('pPrice').value=''; document.getElementById('pQty').value=''; document.getElementById('pBarcode').value='';
}

function toggleAll(){
 showAll=!showAll;
 document.getElementById('productList').classList.toggle('hidden',!showAll);
 document.getElementById('toggleBtn').innerText= showAll ? '🙈 إخفاء الأصناف' : '👁️ عرض كل الأصناف';
 if(showAll) loadProducts();
}

function loadProducts() {
 let list = document.getElementById('productList');
 let search = document.getElementById('search').value.toLowerCase();
 list.innerHTML = '';
 let filtered = products.filter(p => p.name.toLowerCase().includes(search));
 if(filtered.length==0 && search=='' && !showAll){ list.classList.add('hidden'); return; }
 list.classList.remove('hidden');
 filtered.forEach(p => {
 list.innerHTML += `<div class="product-item">
 <div style="cursor:pointer" onclick="addToCart(${p.id})"><b>${p.name}</b><div style="font-size:13px;color:#64748b">${p.price} ج - متبقي: ${p.qty}</div></div>
 <div class="product-actions"><button class="btn-edit" onclick="editProduct(${p.id})">✏️</button><button class="btn-del" onclick="deleteProduct(${p.id})">🗑️</button></div>
 </div>`;
 });
 checkLowStock();
}

function addProduct() {
 let name = document.getElementById('pName').value.trim();
 if(name == '') return alert('دخل اسم المنتج');
 let price = +document.getElementById('pPrice').value;
 let qty = +document.getElementById('pQty').value;
 let barcode = document.getElementById('pBarcode').value;

 if(editingId!==null){
   let p = products.find(x=>x.id==editingId);
   p.name=name; p.price=price; p.qty=qty; p.barcode=barcode;
   editingId=null;
 } else {
   let p = { id: Date.now(), name, price, qty, barcode };
   products.unshift(p);
 }
 localStorage.setItem('products', JSON.stringify(products));
 loadProducts(); closeForm();
}

function editProduct(id){
 let p = products.find(x=>x.id==id);
 editingId=id;
 document.getElementById('pName').value=p.name;
 document.getElementById('pPrice').value=p.price;
 document.getElementById('pQty').value=p.qty;
 document.getElementById('pBarcode').value=p.barcode||'';
 document.getElementById('formTitle').innerText='تعديل المنتج: '+p.name;
 document.getElementById('saveBtn').innerText='حفظ التعديل ✅';
 showAddForm();
}

function deleteProduct(id){
 if(!confirm('متأكد داير تحذف المنتج؟')) return;
 products = products.filter(x=>x.id!=id);
 localStorage.setItem('products', JSON.stringify(products));
 loadProducts();
}

function addToCart(id) {
 let p = products.find(x => x.id == id);
 if(p.qty <= 0) return alert("الكمية خلصت");
 let item = cart.find(x => x.id == id);
 if(item) item.qty++; else cart.push({...p, qty: 1, cartId:id});
 p.qty--; updateCart(); localStorage.setItem('products', JSON.stringify(products)); loadProducts();
}
function removeFromCart(id) {
 let item = cart.find(x => x.id == id);
 let p = products.find(x => x.id == id);
 if(p) p.qty += item.qty;
 cart = cart.filter(x => x.id != id);
 updateCart(); localStorage.setItem('products', JSON.stringify(products)); loadProducts();
}
function updateCart() {
 let table = document.getElementById('cartTable');
 table.innerHTML = '<tr><th>المنتج</th><th>الكمية</th><th>السعر</th><th>حذف</th></tr>';
 let total = 0;
 cart.forEach(item => {
 total += item.price * item.qty;
 table.innerHTML += `<tr><td>${item.name}</td><td>${item.qty}</td><td>${item.price * item.qty}</td><td><button onclick="removeFromCart(${item.id})" style="background:#fef2f2;color:#ef4444;width:auto;padding:4px 10px">X</button></td></tr>`;
 });
 document.getElementById('total').innerText = total;
}
function checkLowStock() {
 let alerts = document.getElementById('alerts'); alerts.innerHTML = '';
 products.filter(p => p.qty <= 3 && p.qty > 0).forEach(p => {
 alerts.innerHTML += `<div class="alert">⚠️ تنبيه: ${p.name} باقي منو ${p.qty} حبات بس</div>`;
 });
}
function saveInvoice() {
 if(cart.length == 0) return alert("السلة فاضية!");
 let invoice = { id: Date.now(), date: new Date().toLocaleString('ar-EG'), items: [...cart], total: document.getElementById('total').innerText };
 invoices.push(invoice); localStorage.setItem('invoices', JSON.stringify(invoices)); cart = []; updateCart(); loadInvoices(); alert("تم حفظ الفاتورة رقم " + invoice.id);
}
function loadInvoices() {
 let list = document.getElementById('invoicesList'); list.innerHTML = '';
 invoices.slice().reverse().forEach(inv => {
 list.innerHTML += `<div style="border:1px solid #e2e8f0; padding:8px; margin:6px 0; border-radius:10px;"><b>فاتورة #${inv.id}</b> - ${inv.date} - <b style="color:green">${inv.total} ج</b></div>`;
 });
}
function exportExcel() {
 if(invoices.length == 0) return alert("لا توجد فواتير");
 let csv = 'رقم الفاتورة,التاريخ,المنتج,الكمية,السعر\n';
 invoices.forEach(inv => { inv.items.forEach(i => { csv += `${inv.id},${inv.date},${i.name},${i.qty},${i.price}\n`; }); });
 let blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'}); let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'mabi3at.csv'; a.click();
}
document.getElementById('search').onkeyup = function(){ if(this.value.length>0){ showAll=true; document.getElementById('toggleBtn').innerText='🙈 إخفاء الأصناف'; } loadProducts(); };
loadProducts(); loadInvoices();
</script>
</body>
</html>
